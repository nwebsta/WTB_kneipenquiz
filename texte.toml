# =============================================================================
# Kneipenmonopoly – alle Texte, die der Bot an die Teams schickt
# =============================================================================
#
# So bearbeitest du die Texte:
#   * Text zwischen den Anführungszeichen ändern, Datei speichern. Fertig.
#     Der Bot liest die Datei bei Änderungen sofort neu ein, ohne Neustart.
#   * Platzhalter in {geschweiften Klammern} setzt der Bot ein, z.B. {bar} oder {team}.
#     Welche Platzhalter ein Text hat, steht im Kommentar darüber. Nicht umbenennen!
#   * Formatierung (Telegram-HTML): <b>fett</b>, <i>kursiv</i>, <code>Code</code>.
#     Ein echtes & muss als &amp; geschrieben werden.
#   * Einzeilige Texte stehen in "…". Darin keine geraden Anführungszeichen (")
#     verwenden, sondern „…“.
#   * Mehrzeilige Texte stehen zwischen ''' und '''. Zeilenumbrüche bleiben erhalten.
#   * Ein leerer Text ("") wird gar nicht angezeigt.
#   * Fehlt ein Text oder hat die Datei einen Tippfehler, nimmt der Bot den
#     Standardtext. Die Verwaltungsseite zeigt dann eine Warnung.
#
# Geschweifte Klammern, die keine Platzhalter sind, als {{ und }} schreiben.
# =============================================================================


